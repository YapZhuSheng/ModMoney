org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Single-module project; parallel execution buys nothing and costs memory.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false

# Compile Kotlin inside the Gradle daemon instead of forking a second JVM.
# On a small build machine two competing heaps is what triggers OOM kills.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
